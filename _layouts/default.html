<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-theme="dark">
  <head>
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", saved || preferred);
      })();
    </script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08111f">
    <title>{{ page.title | default: site.title | escape }}{% unless page.title == site.title %} · {{ site.title | escape }}{% endunless %}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    {% if page.hidden or page.robots %}<meta name="robots" content="{{ page.robots | default: 'noindex,nofollow' }}">{% endif %}

    <style>
      :root {
        --accent: #ff8a3d;
        --accent-strong: #ff6b1a;
        --accent-soft: rgba(255, 138, 61, 0.13);
        --cyan: #55d6be;
        --blue: #5ea7ff;
        --pink: #f472b6;
        --bg-page: #08111f;
        --bg-card: #0d1929;
        --bg-card-strong: #122238;
        --text-main: #f5f7fb;
        --text-muted: #9cacbf;
        --border-color: rgba(148, 174, 204, 0.22);
        --grid-color: rgba(94, 167, 255, 0.055);
        --header-height: 72px;
        --shadow-pixel: 5px 5px 0 rgba(0, 0, 0, 0.34);
        --max-width: 1240px;
      }

      [data-theme="light"] {
        --bg-page: #f3f0e8;
        --bg-card: #fffdf7;
        --bg-card-strong: #ffffff;
        --text-main: #182230;
        --text-muted: #5d6c7c;
        --border-color: rgba(49, 70, 91, 0.2);
        --grid-color: rgba(43, 91, 137, 0.065);
        --shadow-pixel: 5px 5px 0 rgba(34, 54, 73, 0.13);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: calc(var(--header-height) + 24px);
      }

      body {
        margin: 0;
        min-width: 320px;
        background-color: var(--bg-page);
        background-image:
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 24px 24px;
        color: var(--text-main);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
        transition: background-color 180ms ease, color 180ms ease;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 78% 8%, rgba(85, 214, 190, 0.09), transparent 28%),
          radial-gradient(circle at 9% 30%, rgba(255, 138, 61, 0.08), transparent 25%);
        z-index: -1;
      }

      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--accent); }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      img, svg { max-width: 100%; }
      [hidden] { display: none !important; }

      :focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 4px;
      }

      .skip-link {
        position: fixed;
        left: 1rem;
        top: -5rem;
        z-index: 2000;
        padding: 0.65rem 1rem;
        background: var(--text-main);
        color: var(--bg-page);
        border: 2px solid var(--cyan);
      }

      .skip-link:focus { top: 1rem; }

      .site-header {
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding: 0 max(1.2rem, calc((100vw - var(--max-width)) / 2));
        border-bottom: 1px solid var(--border-color);
        background: color-mix(in srgb, var(--bg-page) 88%, transparent);
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--text-main);
        font-weight: 800;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }

      .brand:hover { color: var(--text-main); }

      .brand-mark {
        width: 22px;
        height: 22px;
        position: relative;
        display: inline-block;
        background:
          linear-gradient(var(--accent), var(--accent)) 0 0 / 8px 8px no-repeat,
          linear-gradient(var(--cyan), var(--cyan)) 14px 0 / 8px 8px no-repeat,
          linear-gradient(var(--blue), var(--blue)) 7px 14px / 8px 8px no-repeat;
        filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35));
      }

      .brand-mark::before,
      .brand-mark::after {
        content: "";
        position: absolute;
        height: 2px;
        width: 12px;
        top: 9px;
        background: var(--text-muted);
        transform-origin: left center;
      }

      .brand-mark::before { left: 4px; transform: rotate(31deg); }
      .brand-mark::after { left: 10px; transform: rotate(-31deg); }

      .header-actions,
      .site-nav {
        display: flex;
        align-items: center;
      }

      .header-actions { gap: 1.25rem; }
      .site-nav { gap: 1.25rem; }

      .nav-link {
        color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav-link:hover { color: var(--accent); }

      .theme-toggle-btn {
        min-width: 42px;
        min-height: 34px;
        border: 1px solid var(--border-color);
        border-radius: 2px;
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.18);
      }

      .theme-toggle-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translate(-1px, -1px);
      }

      .page-content {
        width: min(100%, calc(var(--max-width) + 3rem));
        min-height: calc(100vh - var(--header-height) - 110px);
        margin: 0 auto;
        padding: 2.5rem 1.5rem 5rem;
      }

      .site-footer {
        padding: 2rem 1.5rem;
        border-top: 1px solid var(--border-color);
        color: var(--text-muted);
        font-size: 0.82rem;
      }

      .footer-inner {
        width: min(100%, var(--max-width));
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .pixel-label {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 0.4rem;
        background: var(--cyan);
        box-shadow: 0 0 0 3px rgba(85, 214, 190, 0.12);
      }

      .post {
        max-width: 820px;
        margin: 2.5rem auto;
        padding: clamp(1.25rem, 4vw, 3rem);
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        box-shadow: var(--shadow-pixel);
      }

      .post-header {
        margin-bottom: 2.4rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      .post-title {
        margin: 0 0 0.7rem;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .post-meta {
        color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.76rem;
      }

      .post-content { font-size: 1rem; line-height: 1.82; }
      .post-content p { margin: 0 0 1.25rem; }
      .post-content h2, .post-content h3 { margin-top: 2.4rem; line-height: 1.2; }
      .post-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .post-content blockquote { margin: 1.6rem 0; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--text-muted); }
      .post-content code { padding: 0.1rem 0.3rem; background: var(--bg-page); color: var(--cyan); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

      body.entering-tunnel::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 3000;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, #120711 0 8px, #ec4899 8px 12px);
        animation: tunnel-open 280ms steps(6, end) forwards;
      }

      @keyframes tunnel-open {
        from { clip-path: inset(50% 50% 50% 50%); }
        to { clip-path: inset(0 0 0 0); }
      }

      @media (max-width: 760px) {
        :root { --header-height: 64px; }
        .site-header { padding: 0 1rem; gap: 0.75rem; }
        .brand-text { display: none; }
        .header-actions { gap: 0.75rem; }
        .site-nav { gap: 0.85rem; }
        .nav-link { font-size: 0.68rem; }
        .page-content { padding: 1.5rem 1rem 4rem; }
        .footer-inner { flex-direction: column; gap: 0.4rem; }
      }

      @media (max-width: 420px) {
        .nav-work { display: none; }
        .site-nav { gap: 0.75rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="/" aria-label="Ferio Brahmana — home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Ferio Brahmana</span>
      </a>

      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link nav-work" href="/#work">Work</a>
          <a class="nav-link" href="/blog/">Notes</a>
          <a class="nav-link" href="/cv/">CV</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Switch color theme">☼</button>
      </div>
    </header>

    <main id="main-content" class="page-content" aria-label="Content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© {{ site.time | date: '%Y' }} Ferio Brahmana</span>
        <span class="pixel-label"><span class="status-dot"></span>Studying systems without breaking them</span>
      </div>
    </footer>

    <script>
      (function () {
        var toggle = document.getElementById("theme-toggle");
        if (!toggle) return;

        function sync(theme) {
          toggle.textContent = theme === "dark" ? "☼" : "☾";
          toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
        }

        var current = document.documentElement.getAttribute("data-theme") || "dark";
        sync(current);

        toggle.addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          sync(next);
          window.dispatchEvent(new CustomEvent("theme-changed", { detail: { theme: next } }));
        });
      })();
    </script>
  </body>
</html>
